# Local development stack for ManaBandhu.
# NOTE: The recommended local Supabase setup uses the Supabase CLI
# (`supabase start`), which provisions its own Postgres/Auth/Storage/Realtime.
# This compose file provides the Spring Boot backend and an optional
# standalone Postgres for backend integration tests / Flyway.

services:
  postgres:
    image: postgres:16-alpine
    container_name: manabandhu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manabandhu
    ports:
      - "5433:5432"
    volumes:
      - manabandhu-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manabandhu-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manabandhu
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/build

volumes:
  manabandhu-pg-data:
