plugins {
    id "java"
    id "org.springframework.boot" version "3.3.5"
    id "io.spring.dependency-management" version "1.1.6"
}

group = "com.manabandhu"
version = "0.1.0"
description = "ManaBandhu backend - modular monolith by business domain"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-aop"

    // Database
    runtimeOnly "org.postgresql:postgresql"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-database-postgresql"

    // API docs
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0"

    // JWT (Supabase-issued HS256)
    implementation "io.jsonwebtoken:jjwt-api:0.12.6"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:0.12.6"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:0.12.6"

    // Decimal money handling uses java.math.BigDecimal from the JDK.

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
    testImplementation "org.testcontainers:junit-jupiter:1.20.2"
    testImplementation "org.testcontainers:postgresql:1.20.2"
}

tasks.named("test") {
    useJUnitPlatform()
}

// Resolve the gradle wrapper jar if absent (run: gradle wrapper)
tasks.register("ensureWrapper") {
    doLast {
        if (!file("gradle/wrapper/gradle-wrapper.jar").exists()) {
            println "Run 'gradle wrapper' to generate the Gradle wrapper jar."
        }
    }
}
